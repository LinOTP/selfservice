<!-- {{platform}} -->
<ng-container *ngIf="platform === 'other';else mobileTmp">
  <ng-container *ngTemplateOutlet="detailsTmp"></ng-container>
</ng-container>

<ng-template #mobileTmp>
  <div class="d-block d-sm-flex mobile-container">
    <div>
      <a [href]="platformUrl"
         class="d-inline-block mb-2 mb-sm-0 "
         target="_blank"
         rel="noopener noreferrer">
        <img src="assets/app-store.svg"
             alt="Download on the App Store"
             i18n-alt="@@appStoreBadgeAlt"
             class="app-store-badge"
             *ngIf="platform === 'ios'">
        <img src="assets/google-play.png"
             alt="Download on Google Play"
             i18n-alt="@@googlePlayBadgeAlt"
             class="google-play-badge"
             *ngIf="platform === 'android'">
      </a>
    </div>
    <button mat-stroked-button
            color="primary"
            type="button"
            mat-button
            [attr.aria-expanded]="showDetails"
            (click)="showDetails = !showDetails">
      <mat-icon>{{ showDetails ? 'visibility_off' : 'visibility' }}</mat-icon>
      <span *ngIf="!showDetails"
            i18n>Show links for all
        platforms</span>
      <span *ngIf="showDetails"
            i18n>Hide links for all
        platforms</span>
    </button>
  </div>
  <div *ngIf="showDetails">
    <ng-container *ngTemplateOutlet="detailsTmp"></ng-container>
  </div>
</ng-template>

<ng-template #detailsTmp>
  <div class="all-platforms-container row">
    <div *ngIf="appRec?.ios"
         class="col-12 col-md-6 mb-4 mb-md-0">
      <span class="store-name">iOS</span>
      <mat-card appearance="outlined">
        <mat-card-content>
          <span class="store-name">{{appRec.ios?.name}}</span>
          <ng-container *ngIf="appRec.ios?.url">
            <a [href]="appRec.ios.url"
               target="_blank"
               rel="noopener noreferrer"><img src="assets/app-store.svg"
                   alt="Download on the App Store"
                   i18n-alt="@@appStoreBadgeAlt"
                   class="app-store-badge"></a>
            <qrcode role="img"
                    aria-label="QR code for the App Store download link"
                    i18n-aria-label
                    [qrdata]="appRec.ios.url"
                    [width]="180"
                    [margin]="2"
                    [errorCorrectionLevel]="'L'"></qrcode>
          </ng-container>
        </mat-card-content>
      </mat-card>
    </div>
    <div *ngIf="appRec?.android"
         class="col-12 col-md-6">
      <span class="store-name">Android</span>
      <mat-card appearance="outlined">
        <mat-card-content>
          <span class="store-name">{{appRec.android?.name}}</span>
          <ng-container *ngIf="appRec.android?.url">
            <a [href]="appRec.android.url"
               target="_blank"
               rel="noopener noreferrer"><img src="assets/google-play.png"
                   alt="Download on Google Play"
                   i18n-alt="@@googlePlayBadgeAlt"
                   class="google-play-badge"></a>
            <qrcode role="img"
                    aria-label="QR code for the Google Play download link"
                    i18n-aria-label
                    [qrdata]="appRec.android.url"
                    [width]="180"
                    [margin]="2"
                    [errorCorrectionLevel]="'L'"></qrcode>
          </ng-container>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</ng-template>
